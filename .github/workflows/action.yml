name: Dytes
description: Install, update and publish Piksel packages with the dytes CLI
author: funxdata
branding:
  icon: package
  color: blue

inputs:
  command:
    description: "dytes subcommand to run: publish, update, install, init, test or config"
    required: false
    default: publish
  args:
    description: "Extra arguments passed to the subcommand, e.g. --force or --dry-run"
    required: false
    default: ""
  dir:
    description: "Package directory (relative to the workspace)"
    required: false
    default: "."
  version:
    description: "dytes release version to download; defaults to this Action's ref (vX.Y.Z)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require Linux runner
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "::error::dytes Action 只提供 Linux 无 GUI 构建，请使用 ubuntu runner"
        exit 1

    - name: Download dytes
      shell: bash
      env:
        DYTES_REF: ${{ inputs.version || github.action_ref }}
      run: |
        set -euo pipefail
        case "$DYTES_REF" in
          v[0-9]*) version="${DYTES_REF#v}" ;;
          [0-9]*) version="$DYTES_REF" ;;
          *)
            echo "::error::无法从 Action 引用 '$DYTES_REF' 推断版本，请显式传入 version: vX.Y.Z"
            exit 1
            ;;
        esac
        asset="dytes-action.bin"
        url="https://github.com/dytescn/dytes/releases/download/v${version}/${asset}"
        bin_dir="${RUNNER_TEMP}/dytes-bin"
        mkdir -p "${bin_dir}"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --retry-connrefused \
          "${url}" -o "${bin_dir}/dytes"
        chmod +x "${bin_dir}/dytes"
        echo "${bin_dir}" >> "${GITHUB_PATH}"
        "${bin_dir}/dytes" --version

    - name: Run dytes
      shell: bash
      env:
        DYTES_COMMAND: ${{ inputs.command }}
        DYTES_ARGS: ${{ inputs.args }}
        DYTES_DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        cd "${DYTES_DIR}"
        if [ -n "${DYTES_ARGS}" ]; then
          read -r -a extra <<< "${DYTES_ARGS}"
          dytes "${DYTES_COMMAND}" "${extra[@]}"
        else
          dytes "${DYTES_COMMAND}"
        fi
