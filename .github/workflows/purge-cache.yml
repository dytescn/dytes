name: Purge dytes CDN cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/purge-cache.yml"

permissions:
  contents: read

jobs:
  purge-cache:
    name: Purge CDN cache
    runs-on: ubuntu-latest
    # CDN 刷新凭证定义在 environment `product`（也兼容 repository secrets）。
    environment: product
    steps:
      - name: Purge unversioned paths
        shell: bash
        env:
          # 又拍云 CDN 刷新需要「操作员名 / 密码」，不能复用 S3 的
          # UPYUN_API_KEY / UPYUN_API_SECRET（会返回 401 user not exists）。
          UPYUN_CDN_OPERATOR: ${{ secrets.UPYUN_CDN_OPERATOR }}
          UPYUN_CDN_PASSWORD: ${{ secrets.UPYUN_CDN_PASSWORD }}
          UPYUN_BUCKET: ${{ secrets.UPYUN_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${UPYUN_CDN_OPERATOR:-}" ] || [ -z "${UPYUN_CDN_PASSWORD:-}" ]; then
            echo "::error::未配置 UPYUN_CDN_OPERATOR / UPYUN_CDN_PASSWORD，无法刷新 CDN。"
            exit 1
          fi
          # 未版本化清单与 latest 别名会被 CDN 缓存 8 天，仅覆盖同名对象
          # 不会让 CDN 立即回源，必须显式刷新。同时提交 http / https，
          # 兼容 CDN 的缓存键差异。
          paths=(
            "core/dytes/dytes.json"
            "core/dytes/latest/version.js"
            "core/dytes/latest/windows/dytes.exe"
            "core/dytes/latest/windows/dytes.exe.sha256"
            "core/dytes/latest/linux/dytes.bin"
            "core/dytes/latest/linux/dytes.bin.sha256"
            "core/dytes/latest/macos/dytes.app"
            "core/dytes/latest/macos/dytes.app.sha256"
          )
          password_md5=$(printf '%s' "$UPYUN_CDN_PASSWORD" | md5sum | awk '{print $1}')
          purge_batch() {
            local scheme="$1"
            local urls=""
            for path in "${paths[@]}"; do
              urls+="${scheme}://packages.funxdata.com/${path}"$'\n'
            done
            local date_str
            date_str=$(date -u '+%a, %d %b %Y %H:%M:%S GMT')
            local sign
            sign=$(printf '%s&%s&%s&%s' "$urls" "$UPYUN_BUCKET" "$date_str" "$password_md5" | md5sum | awk '{print $1}')
            local auth="UpYun ${UPYUN_BUCKET}:${UPYUN_CDN_OPERATOR}:${sign}"
            local code
            code=$(curl -sS --max-time 30 -o "purge-response-${scheme}.json" -w '%{http_code}' \
              -X POST "http://purge.upyun.com/purge/" \
              -H "Authorization: $auth" -H "Date: $date_str" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "purge=$urls") || code="000"
            local body
            body=$(cat "purge-response-${scheme}.json" 2>/dev/null || true)
            echo "CDN 刷新（$scheme）HTTP $code: $body"
            echo "::notice::CDN purge $scheme -> $code $body"
            if [ "$code" != "200" ]; then
              echo "::error::CDN 刷新失败（$scheme，HTTP $code）：$body"
              return 1
            fi
            if printf '%s' "$body" | grep -q 'invalid_domain_of_url'; then
              echo "::warning::CDN 刷新返回无效域名列表：$body"
            fi
            return 0
          }
          status=0
          purge_batch http || status=1
          purge_batch https || status=1
          exit "$status"
