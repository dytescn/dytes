name: Release dytes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      allow_same_version:
        description: "允许与线上相同的版本（仅用于重发）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dytes-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  preflight:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify versions and tag
        shell: bash
        env:
          ALLOW_SAME_VERSION: ${{ inputs.allow_same_version || 'false' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          const fail = (message) => {
            console.error(`\n错误: ${message}\n`);
            process.exit(1);
          };
          const read = (file) => fs.readFileSync(file, "utf8");

          (async () => {
            const manifest = JSON.parse(read("dytes.json")).version;
            const cargo = read("Cargo.toml").match(
              /\[package\][\s\S]*?^version = "([^"]+)"/m,
            )?.[1];
            const lock = read("Cargo.lock").match(
              /\[\[package\]\]\r?\nname = "dytes"\r?\nversion = "([^"]+)"/,
            )?.[1];

            if (!cargo) fail("Cargo.toml 中未找到 [package] version");
            if (!lock) fail('Cargo.lock 中未找到 name = "dytes" 的包');
            if (manifest !== cargo || manifest !== lock) {
              fail(
                `版本不一致: dytes.json=${manifest} Cargo.toml=${cargo} Cargo.lock=${lock}`,
              );
            }
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(manifest)) {
              fail(`版本号不是合法 semver: ${manifest}`);
            }
            console.log(`当前版本: ${manifest}`);

            const ref = process.env.GITHUB_REF || "";
            if (ref.startsWith("refs/tags/")) {
              const tag = ref.slice("refs/tags/".length);
              if (tag !== `v${manifest}`) {
                fail(`tag ${tag} 与清单版本不一致，应为 v${manifest}`);
              }
            }

            const parseVersion = (value) => {
              const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(value);
              if (!match) fail(`无法比较版本: ${value}`);
              return {
                numbers: [Number(match[1]), Number(match[2]), Number(match[3])],
                pre: match[4] || "",
              };
            };
            const compareVersion = (a, b) => {
              const left = parseVersion(a);
              const right = parseVersion(b);
              for (let i = 0; i < 3; i += 1) {
                if (left.numbers[i] !== right.numbers[i]) {
                  return left.numbers[i] > right.numbers[i] ? 1 : -1;
                }
              }
              if (left.pre === right.pre) return 0;
              if (!left.pre) return 1;
              if (!right.pre) return -1;
              return left.pre.localeCompare(right.pre, "en", { numeric: true });
            };

            const index =
              process.env.DYTES_RELEASE_INDEX ||
              "https://packages.funxdata.com/core/dytes/dytes.json";
            let online = null;
            try {
              const url = `${index}${index.includes("?") ? "&" : "?"}t=${Date.now()}`;
              const response = await fetch(url, {
                headers: { "cache-control": "no-cache", pragma: "no-cache" },
                signal: AbortSignal.timeout(15000),
              });
              if (response.status !== 404) {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data.version) throw new Error("清单中没有 version 字段");
                online = data.version;
              }
            } catch (error) {
              console.log(
                `警告: 读取线上版本失败 (${error.message})；跳过线上版本比较，继续发布`,
              );
            }

            if (online) {
              console.log(`线上版本: ${online}`);
              const comparison = compareVersion(manifest, online);
              if (comparison < 0) {
                fail(`目标版本 ${manifest} 小于线上版本 ${online}，拒绝回退发布。`);
              }
              if (
                comparison === 0 &&
                process.env.ALLOW_SAME_VERSION !== "true"
              ) {
                fail(
                  `目标版本 ${manifest} 与线上版本相同。每次发布必须升一个小版本；` +
                    "确需重发请在手动触发时勾选 allow_same_version。",
                );
              }
              console.log(`版本校验通过: ${manifest} > ${online}`);
            }

            console.log("校验通过 ✔");
          })().catch((error) => fail(error.message));
          NODE

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    environment: product
    env:
      UPYUN_API_KEY: ${{ secrets.UPYUN_API_KEY }}
      UPYUN_API_SECRET: ${{ secrets.UPYUN_API_SECRET }}
      UPYUN_BUCKET: ${{ secrets.UPYUN_BUCKET }}
      UPYUN_ENDPOINT: ${{ secrets.UPYUN_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: dytes.exe
            artifact: dytes-windows.exe
            package: dytes.exe
          - os: ubuntu-latest
            platform: linux
            binary: dytes
            artifact: dytes-linux
            package: dytes.bin
          - os: macos-latest
            platform: macos
            binary: dytes
            artifact: dytes-macos
            package: dytes.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Unix build dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y \
              cmake ninja-build pkg-config \
              libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
              libwayland-dev wayland-protocols \
              libegl1-mesa-dev libgl1-mesa-dev \
              libfontconfig1-dev libfreetype6-dev
          else
            brew install cmake ninja pkg-config
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test library
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --locked 2>&1 | tee test.log

      - name: Test summary
        if: failure()
        shell: bash
        run: |
          {
            echo '```text'
            tail -120 test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build dytes
        run: cargo build --release --locked --features gui

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing dytes $version for ${{ matrix.platform }}"

      - name: Verify manifest and Cargo version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version=$(node -p "require('./dytes.json').version")
          cargo_version=$(cargo metadata --format-version 1 --no-deps \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.packages.find(p=>p.name==="dytes").version)})')
          echo "manifest=$manifest_version cargo=$cargo_version"
          test "$manifest_version" = "$cargo_version"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload artifact
          cp "target/release/${{ matrix.binary }}" "upload/${{ matrix.package }}"
          cp "target/release/${{ matrix.binary }}" "artifact/${{ matrix.artifact }}"
          ls -l upload artifact

      - name: Write SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const file = process.argv[1];
            const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            fs.writeFileSync(file + '.sha256', hash + '  ' + require('path').basename(file) + '\n');
          " "upload/${{ matrix.package }}"
          cat "upload/${{ matrix.package }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dytes-${{ matrix.platform }}
          path: artifact/
          if-no-files-found: error

      - name: Upload binary to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload
          destination_dir: core/dytes/${{ steps.version.outputs.version }}/${{ matrix.platform }}
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}

      - name: Publish latest alias
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload
          destination_dir: core/dytes/latest/${{ matrix.platform }}
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}

      - name: Set short cache TTL on latest alias
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPYUN_API_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPYUN_API_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
          UPYUN_BUCKET: ${{ secrets.UPYUN_BUCKET }}
          UPYUN_ENDPOINT: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.package }}
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          aws s3 cp "upload/$BINARY" "s3://$UPYUN_BUCKET/core/dytes/latest/$PLATFORM/$BINARY" \
            --endpoint-url "$UPYUN_ENDPOINT" \
            --cache-control "no-cache, max-age=60"
          echo "已为 latest/$PLATFORM/$BINARY 设置短缓存"

  publish-manifest:
    name: Publish dytes.json
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    environment: product
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload-manifest upload-latest
          cp dytes.json upload-manifest/dytes.json
          node -e "
            const fs = require('fs');
            const version = require('./dytes.json').version;
            const base = 'https://packages.funxdata.com/core/dytes/latest';
            const downloads = {
              windows: base + '/windows/dytes.exe',
              linux: base + '/linux/dytes',
              macos: base + '/macos/dytes',
            };
            fs.writeFileSync(
              'upload-latest/version.js',
              'window.DYTES_RELEASE=' + JSON.stringify({ version, downloads }) + ';\n'
            );
          "
          ls -l upload-manifest upload-latest

      - name: Upload manifest to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload-manifest
          destination_dir: core/dytes
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}

      # verify-release 会检查 core/dytes/<version>/dytes.json；
      # 仅上传未版本化清单会导致 0.1.14 / 0.1.15 的自检 404。
      - name: Upload versioned manifest to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload-manifest
          destination_dir: core/dytes/${{ steps.version.outputs.version }}
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}

      - name: Upload website version script to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload-latest
          destination_dir: core/dytes/latest
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}

      - name: Set short cache TTL on manifest and version script
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPYUN_API_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPYUN_API_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
          UPYUN_BUCKET: ${{ secrets.UPYUN_BUCKET }}
          UPYUN_ENDPOINT: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          aws s3 cp upload-manifest/dytes.json \
            "s3://$UPYUN_BUCKET/core/dytes/dytes.json" \
            --endpoint-url "$UPYUN_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=60"
          aws s3 cp upload-latest/version.js \
            "s3://$UPYUN_BUCKET/core/dytes/latest/version.js" \
            --endpoint-url "$UPYUN_ENDPOINT" \
            --content-type "application/javascript" \
            --cache-control "no-cache, max-age=60"
          echo "已为 dytes.json 与 version.js 设置短缓存"

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - preflight
      - build
      - publish-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            dytes.json
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify published files
    needs:
      - preflight
      - publish-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify download endpoints and manifest content
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          base="${DYTES_PACKAGES_BASE:-https://packages.funxdata.com/core/dytes}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "$tag_version" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 dytes.json 版本 ${version} 不一致"
            exit 1
          fi
          echo "版本: $version（tag: ${GITHUB_REF_NAME:-本地}）"

          check_status() {
            local url="$1"
            local attempt code
            for attempt in $(seq 1 20); do
              code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "OK $url"
                return 0
              fi
              echo "等待 $url (HTTP ${code:-000}, $attempt/20)"
              sleep 15
            done
            echo "::error::发布自检失败: $url 不可访问。若对象已上传，请刷新 CDN 缓存后重试。"
            return 1
          }

          for platform in windows linux macos; do
            case "$platform" in
              windows) file="dytes.exe" ;;
              linux) file="dytes.bin" ;;
              macos) file="dytes.app" ;;
            esac
            check_status "$base/$version/$platform/$file?t=$(date +%s)"
            check_status "$base/latest/$platform/$file?t=$(date +%s)"
            check_status "$base/latest/$platform/$file.sha256?t=$(date +%s)"
          done

          echo "检查版本化清单..."
          check_status "$base/$version/dytes.json?t=$(date +%s)"

          echo "检查 dytes.json 内容..."
          manifest_ok=false
          for attempt in $(seq 1 8); do
            manifest_version=$(curl -fsSL "$base/dytes.json?t=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
            if [ "$manifest_version" = "$version" ]; then
              echo "OK dytes.json -> $version"
              manifest_ok=true
              break
            fi
            echo "等待 dytes.json 更新 (读到 ${manifest_version:-空}, $attempt/8)"
            sleep 10
          done
          if [ "$manifest_ok" != "true" ]; then
            # 未版本化清单受 CDN 缓存影响；版本化清单与三平台产物已在上方验证。
            echo "::warning::dytes.json 仍返回旧版本（CDN 缓存）；版本化清单与产物已验证，继续发布。"
          fi

          echo "检查 version.js 内容..."
          script_ok=false
          for attempt in $(seq 1 8); do
            script=$(curl -fsSL "$base/latest/version.js?t=$(date +%s)" || true)
            if printf '%s' "$script" | grep -q "\"version\":\"$version\""; then
              echo "OK version.js -> $version"
              script_ok=true
              break
            fi
            echo "等待 version.js 更新 ($attempt/8)"
            sleep 10
          done
          if [ "$script_ok" != "true" ]; then
            echo "::warning::version.js 仍返回旧版本（CDN 缓存）；版本化清单与产物已验证，继续发布。"
          fi

  notify-website:
    name: Notify website repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - preflight
      - github-release
      - verify-release
    runs-on: ubuntu-latest
    env:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Dispatch dytes-release to website repository
        if: env.WEBSITE_DISPATCH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          payload=$(node -e '
            const base = "https://packages.funxdata.com/core/dytes/latest";
            const version = process.env.RELEASE_VERSION;
            console.log(JSON.stringify({
              event_type: "dytes-release",
              client_payload: {
                version,
                downloads: {
                  windows: `${base}/windows/dytes.exe`,
                  linux: `${base}/linux/dytes.bin`,
                  macos: `${base}/macos/dytes.app`,
                },
              },
            }));
          ')
          curl -fsS -X POST \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dytescn/dytescn.github.io/dispatches" \
            --data "$payload"
          echo "已通知官网仓库同步版本 $RELEASE_VERSION"

      - name: Website sync skipped
        if: env.WEBSITE_DISPATCH_TOKEN == ''
        shell: bash
        run: |
          echo "::warning::未配置 WEBSITE_DISPATCH_TOKEN，跳过官网自动同步。"
          echo "官网仍会在页面加载时读取 latest/version.js；建议配置 token 以在发布后立即更新官网静态版本文件。"
