[package]
name = "dytes"
version = "0.1.7"
edition = "2021"
description = "Piksel package installer, updater, publisher and manifest tool."
license = "MIT"

[lib]
name = "dytes"
path = "src/lib.rs"

[[bin]]
name = "dytes"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-credential-types = "1.1.7"
aws-sdk-s3 = { version = "1.139.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.33"
oxc = { version = "0.144.0", features = ["full"] }
reqwest = { version = "0.13.4", features = ["stream", "blocking", "json"] }
rpassword = "7"
semver = "1.0.28"
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
