[package]
name = "dytes"
version = "0.2.31"
edition = "2021"
description = "Design software package management tool."
license = "MIT"

[lib]
name = "dytes"
path = "src/lib.rs"

[[bin]]
name = "dytes"
path = "src/main.rs"

[features]
default = []

[workspace]

# Win7：combase.dll 不存在。windows-core 的 CoTaskMemAlloc / CoTaskMemFree /
# CoCreateFreeThreadedMarshaler 在 ole32.dll 中同样可用，这里用本地补丁指向 ole32。
[patch.crates-io]
windows-core = { path = "vendor/windows-core" }

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.33"
libloading = "0.8"
reqwest = { version = "0.13.4", features = ["stream", "blocking", "json"] }
rpassword = "7"
semver = "1.0.28"
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
