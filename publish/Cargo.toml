[package]
name = "publish"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.139.0"
aws-credential-types = "1.1.7"
semver = "1.0.28"
