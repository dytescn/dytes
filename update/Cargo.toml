[package]
name = "update"
version = "0.1.0"
edition = "2024"

[lib]
name = "update"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
downloader = "0.2.8"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", features = ["stream", "blocking", "json"] }
semver = "1.0.28"
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"
slint = "1.17.0"
tokio = { version = "1.52.3", features = ["full"] }
aws-sdk-s3 = "1.139.0"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-credential-types = "1.1.7"
regex = "1.13.1"
oxc = { version = "0.144.0", features = ["full"] }


[build-dependencies]
slint-build = "1.17.0"

# ---------- 平台相关 ----------
[target.'cfg(target_os = "windows")'.dependencies]
windows = { 
    version = "0.62.2",
    features = [
        "Win32_Foundation",
        "Win32_System_Console",
        "Win32_System_Threading"
    ]
}

[dev-dependencies]
tempfile = "3.27.0"
walkdir = "2.4"
tokio = { version = "1.52.3", features = ["full", "rt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
incremental = false
debug = false
strip = true
